<!doctype html>
<html lang="zxx">
  <head>
    <title>Trang chủ</title>
    <link
      rel="icon"
      href="images/icon.svg"
      type="image/svg+xml"
      sizes="16x16"
    />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="description" />
    <meta content="" name="keywords" />
    <meta content="" name="author" />
    <!-- CSS Files
    ================================================== -->
    <link
      id="bootstrap"
      href="css/bootstrap.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      id="bootstrap-grid"
      href="css/bootstrap-grid.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      id="bootstrap-reboot"
      href="css/bootstrap-reboot.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="css/animate.css" rel="stylesheet" type="text/css" />
    <link href="css/owl.carousel.css" rel="stylesheet" type="text/css" />
    <link href="css/owl.theme.css" rel="stylesheet" type="text/css" />
    <link href="css/owl.transitions.css" rel="stylesheet" type="text/css" />
    <link href="css/magnific-popup.css" rel="stylesheet" type="text/css" />
    <link href="css/jquery.countdown.css" rel="stylesheet" type="text/css" />
    <link id="mdb" href="css/mdb.min.css" rel="stylesheet" type="text/css" />
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link href="css/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <!-- color scheme -->
    <link
      id="colors"
      href="css/colors/scheme-01.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="css/coloring.css" rel="stylesheet" type="text/css" />
    <link href="css/font-awesome.min.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="wrapper">
      <div id="preloader">
        <div class="preloader1"></div>
      </div>
      <!-- header begin -->
      <div data-component="Navbar" data-active="index.html"></div>
      <!-- header close -->
      <!-- content begin -->
      <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <section id="section-hero" aria-label="section">
          <div class="container">
            <div class="row align-items-center">
              <div class="col-md-6">
                <div class="spacer-single"></div>

                <div class="spacer-10"></div>
                <h1
                  class="wow fadeInUp"
                  data-wow-delay=".75s"
                  style="line-height: 1.2"
                >
                  Thuê văn phòng ảo với giá
                  <span style="color: #1da599">rẻ nhất</span> thị trường<br />Kích
                  hoạt tức thì
                </h1>
                <p class="wow fadeInUp lead" data-wow-delay="1s">
                  Viospace cung cấp giải pháp văn phòng ảo hiện đại, chuyên
                  nghiệp với chi phí tối ưu nhất. Nâng tầm hình ảnh doanh nghiệp
                  của bạn ngay hôm nay.
                </p>
                <div class="spacer-10"></div>
                <a
                  href="register.html"
                  class="btn-main wow fadeInUp lead"
                  data-wow-delay="1.25s"
                  style="background-color: #1da599; border-color: #1da599"
                  >Đăng ký ngay</a
                >
                <div class="spacer-single"></div>
                <div data-component="StatsCounter"></div>
                <div class="mb-sm-30"></div>
              </div>
              <div class="col-md-6">
                <div class="row g-2">
                  <div class="col-6">
                    <img
                      src="images/misc/is-1.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay="1.25s"
                      style="
                        height: 200px;
                        width: 100%;
                        object-fit: cover;
                        margin-bottom: 10px;
                      "
                      alt=""
                    />
                    <img
                      src="images/misc/is-3.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay="1.5s"
                      style="height: 250px; width: 100%; object-fit: cover"
                      alt=""
                    />
                  </div>
                  <div class="col-6">
                    <img
                      src="images/misc/is-2.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay="1.4s"
                      style="
                        height: 300px;
                        width: 100%;
                        object-fit: cover;
                        margin-bottom: 10px;
                      "
                      alt=""
                    />
                    <img
                      src="images/misc/is-1.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay="1.6s"
                      style="height: 150px; width: 100%; object-fit: cover"
                      alt=""
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
        <section id="section-core-strengths" class="pt60 pb60">
          <div class="container">
            <div data-component="SectionHeader" data-title="THẾ MẠNH CỐT LÕI CỦA VIOSPACE"></div>
            <div class="spacer-single"></div>
            <div class="row align-items-center">
              <div class="col-md-6 mb-sm-30">
                <div class="row g-2">
                  <div class="col-6">
                    <img
                      src="images/misc/is-1.jpg"
                      class="img-fluid rounded mb-2 wow fadeIn"
                      data-wow-delay=".2s"
                      style="height: 180px; width: 100%; object-fit: cover"
                    />
                    <img
                      src="images/misc/is-2.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay=".4s"
                      style="height: 220px; width: 100%; object-fit: cover"
                    />
                  </div>
                  <div class="col-6">
                    <img
                      src="images/misc/is-3.jpg"
                      class="img-fluid rounded wow fadeIn"
                      data-wow-delay=".6s"
                      style="height: 410px; width: 100%; object-fit: cover"
                    />
                  </div>
                </div>
              </div>
              <div class="col-md-5 offset-md-1">
                <div data-component="FeatureList"></div>
              </div>
            </div>
          </div>
        </section>
        <section id="section-pricing">
          <div class="container">
            <div data-component="SectionHeader" data-title="CHỌN GÓI GIẢI PHÁP - KHỞI SỰ TỐC ĐỘ" data-subtitle="Minh bạch 100%. Không phí ẩn. Hỗ trợ hoàn tiền nếu không được cấp GPKD" data-show-border="false"></div>
            <div data-component="PricingGrid"></div>
          </div>
        </section>

        <section id="section-locations" class="pt60 pb60 bg-color-secondary">
          <div class="container">
            <div data-component="SectionHeader" data-title="Mạng lưới phủ sóng 3 miền"></div>
            <div class="spacer-single"></div>
            <div data-component="LocationGrid"></div>
          </div>
        </section>

        <section id="section-legal" class="pt60 pb60">
          <div class="container">
            <div data-component="SectionHeader" data-title="Pháp Lý Chuẩn - Vững Vàng Khởi Nghiệp" data-subtitle="Hệ sinh thái pháp lý toàn diện từ VIOSPACE giúp doanh nghiệp an tâm phát triển vững mạnh." data-show-border="false"></div>
            <div class="spacer-single"></div>
            <div data-component="CardGrid"></div>
          </div>
        </section>
      </div>
      <!-- content close -->
      <a href="#" id="back-to-top"></a>
      <!-- footer begin -->
      <div data-component="Footer"></div>
      <!-- footer close -->
    </div>



    <!-- Javascript Files
================================================== -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script src="js/jquery.isotope.min.js"></script>
    <script src="js/easing.js"></script>
    <script src="js/lenis.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="js/OwlCarousel2Thumbs.min.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/enquire.min.js"></script>
    <script src="js/jquery.plugin.js"></script>
    <script src="js/jquery.countTo.js"></script>
    <script src="js/jquery.countdown.js"></script>
    <script src="js/jquery.lazy.min.js"></script>
    <script src="js/jquery.lazy.plugins.min.js"></script>

    <!-- VIOSPACE Component Engine -->
    <script src="js/config/site.config.js"></script>
    <script src="js/config/sections.config.js"></script>
    <script src="js/components/layout/Navbar.js"></script>
    <script src="js/components/layout/Footer.js"></script>
    <script src="js/components/layout/FloatingContact.js"></script>
    <script src="js/components/sections/SectionHeader.js"></script>
    <script src="js/components/sections/StatsCounter.js"></script>
    <script src="js/components/sections/FeatureList.js"></script>
    <script src="js/components/sections/PricingGrid.js"></script>
    <script src="js/components/sections/LocationGrid.js"></script>
    <script src="js/components/sections/CardGrid.js"></script>
    <script src="js/core/ComponentLoader.js"></script>

    <script src="js/designesia.js"></script>

    <!-- Floating Contact Widget -->
    <div data-component="FloatingContact"></div>
  </body>
</html>
