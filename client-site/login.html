<!doctype html>
<html lang="zxx">

<head>
  <title>Đăng nhập</title>
  <link rel="icon" href="images/icon.svg" type="image/svg+xml" sizes="16x16" />
  <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta content="Đăng nhập" name="description" />
  <meta content="" name="keywords" />
  <meta content="" name="author" />
  <link id="bootstrap" href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
  <link id="bootstrap-grid" href="css/bootstrap-grid.min.css" rel="stylesheet" type="text/css" />
  <link id="bootstrap-reboot" href="css/bootstrap-reboot.min.css" rel="stylesheet" type="text/css" />
  <link href="css/animate.css" rel="stylesheet" type="text/css" />
  <link href="css/owl.carousel.css" rel="stylesheet" type="text/css" />
  <link href="css/owl.theme.css" rel="stylesheet" type="text/css" />
  <link href="css/owl.transitions.css" rel="stylesheet" type="text/css" />
  <link href="css/magnific-popup.css" rel="stylesheet" type="text/css" />
  <link href="css/jquery.countdown.css" rel="stylesheet" type="text/css" />
  <link href="css/style.css" rel="stylesheet" type="text/css" />
  <!-- color scheme -->
  <link id="colors" href="css/colors/scheme-01.css" rel="stylesheet" type="text/css" />
  <link href="css/coloring.css" rel="stylesheet" type="text/css" />
  <link href="css/font-awesome.min.css" rel="stylesheet" type="text/css" />
  <link href="css/custom-forms.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div id="wrapper">
    <!-- header begin -->
    <div data-component="Navbar" data-active="login.html" data-action="register"></div>
    <!-- header close -->
    <!-- content begin -->
    <div class="no-bottom no-top" id="content">
      <div id="top"></div>

      <section class="full-height relative no-top no-bottom vertical-center"
        data-bgimage="url(images/background/subheader.jpg) top" data-stellar-background-ratio=".5">
        <div class="overlay-gradient t50">
          <div class="center-y relative">
            <div class="container">
              <div class="row align-items-center">
                <div class="col-lg-6 text-light wow fadeInRight" data-wow-delay=".5s">
                  <div class="spacer-10"></div>
                  <h1 style="
                        font-weight: bold;
                        font-size: 56px;
                        line-height: 1.1;
                        margin-bottom: 20px;
                      ">
                    Quản Lý Văn Phòng<br />Thông Minh
                  </h1>
                  <p class="lead" style="font-size: 16px; line-height: 1.8">
                    Đăng nhập vào hệ thống Viospace để quản lý văn phòng, đặt
                    lịch phòng họp và theo dõi hợp đồng dịch vụ văn phòng ảo
                    của doanh nghiệp bạn một cách tiện lợi.
                  </p>
                </div>

                <div class="col-lg-4 offset-lg-1 wow fadeIn" data-wow-delay=".5s">
                  <div class="box-rounded p-4 p-md-4 login-card-glass">
                    <h3 class="mb-3" style="
                          font-weight: 800;
                          font-size: 22px;
                          color: #1e293b;
                        ">
                      Đăng nhập
                    </h3>
                    <form name="loginForm" id="login_form" class="form-border" action="customer-dashboard.html"
                      method="post">
                      <div class="field-set mb-3">
                        <label class="form-label" style="
                              font-size: 13px;
                              font-weight: 600;
                              color: #475569;
                            ">Địa chỉ Email</label>
                        <input type="text" name="email" id="email" class="form-control"
                          placeholder="Nhập email của bạn..." value="demo@techvision.vn" required />
                      </div>

                      <div class="field-set mb-3">
                        <label class="form-label" style="
                              font-size: 13px;
                              font-weight: 600;
                              color: #475569;
                            ">Mật khẩu</label>
                        <input type="password" name="password" id="password" class="form-control"
                          placeholder="Nhập mật khẩu..." value="••••••••" required />
                      </div>

                      <div class="field-set mt-4">
                        <button type="submit" id="btn_login_submit" class="btn btn-login-submit py-3">
                          <i class="fa fa-sign-in me-2"></i>Đăng nhập
                        </button>
                      </div>
                      <div class="clearfix"></div>

                      <div class="text-center mt-3">
                        <a href="#" style="
                              color: #64748b;
                              font-size: 13px;
                              font-weight: 600;
                            ">Quên mật khẩu?</a>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <!-- content close -->

    <!-- footer begin -->
    <div data-component="Footer"></div>
    <!-- footer close -->
  </div>

  <!-- Floating Contact Widget -->
  <div data-component="FloatingContact"></div>



  <!-- Javascript Files
    ================================================== -->
  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/wow.min.js"></script>
  <script src="js/jquery.isotope.min.js"></script>
  <script src="js/easing.js"></script>
  <script src="js/lenis.js"></script>
  <script src="js/owl.carousel.js"></script>
  <script src="js/OwlCarousel2Thumbs.min.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/jquery.magnific-popup.min.js"></script>
  <script src="js/enquire.min.js"></script>
  <script src="js/jquery.plugin.js"></script>
  <script src="js/jquery.countTo.js"></script>
  <script src="js/jquery.countdown.js"></script>
  <script src="js/jquery.lazy.min.js"></script>
  <script src="js/jquery.lazy.plugins.min.js"></script>

  <!-- VIOSPACE Component Engine -->
  <script src="js/config/site.config.js"></script>
  <script src="js/components/layout/Navbar.js"></script>
  <script src="js/components/layout/Footer.js"></script>
  <script src="js/components/layout/FloatingContact.js"></script>
  <script src="js/core/ComponentLoader.js"></script>

  <script src="js/designesia.js"></script>

  <!-- CLEAN URL LOGIN REDIRECT SCRIPT -->
  <script>
    $(document).ready(function () {
      $("#login_form").on("submit", function (e) {
        e.preventDefault();
        var $btn = $("#btn_login_submit");
        $btn
          .html('<i class="fa fa-spinner fa-spin me-2"></i>Đang đăng nhập...')
          .prop("disabled", true);

        setTimeout(function () {
          window.location.href = "customer-dashboard.html";
        }, 500);
      });
    });
  </script>
</body>

</html>
